<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Schedule</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <header>
    <h1>Class Schedule</h1>
    <p>4th Year Dentistry</p>
  </header>

  <!-- 10-Day Rolling Date Ribbon -->
  <div class="date-ribbon">
    <div class="date-card today">
      <span class="day">Sun</span>
      <span class="num">20</span>
    </div>
    <div class="date-card active-tomorrow">
      <span class="day">Mon</span>
      <span class="num">21</span>
      <span class="badge">Tomorrow</span>
    </div>
    <div class="date-card">
      <span class="day">Tue</span>
      <span class="num">22</span>
    </div>
    <div class="date-card">
      <span class="day">Wed</span>
      <span class="num">23</span>
    </div>
    <!-- We will use JavaScript to auto-generate the rest of the 10 days later -->
  </div>

  <!-- Monday Schedule Cards -->
  <main class="schedule-container">
    <div class="time-block">
      <div class="time">8:00 - 9:00 AM</div>
      <div class="subject-card">
        <h2>General Medicine</h2>
        <span class="note-badge">Midterm notes uploaded</span>
      </div>
    </div>

    <div class="time-block">
      <div class="time">9:00 - 10:00 AM</div>
      <div class="subject-card">
        <h2>Oral Surgery</h2>
      </div>
    </div>

    <div class="time-block">
      <div class="time">10:00 - 12:00 PM</div>
      <div class="subject-card split-group">
        <div class="group-col">
          <h3>Group A</h3>
          <p>Oral Surgery Lab</p>
        </div>
        <div class="divider"></div>
        <div class="group-col">
          <h3>Group B</h3>
          <p>Oral Surgery Lab</p>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
